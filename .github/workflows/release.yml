name: Release

# Pushing a tag (for example `0.1.3`) builds the plugin, signs the build with a
# GitHub artifact attestation and publishes the three release assets. The
# Obsidian directory expects the tag to equal `manifest.json` -> `version`.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the OIDC token used to sign the attestation
  attestations: write # publish the attestation

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the ref is a tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::This workflow must run against a tag ref, got '${GITHUB_REF_TYPE}'."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
